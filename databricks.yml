# This is a Declarative Automation Bundle definition for energy_realtime.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: energy_realtime
  uuid: 9a9ea5b5-87b4-485a-9194-4474605792fa

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8344e144-87d0.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-8344e144-87d0.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ajaysin840@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ajaysin840@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: ajaysin840@gmail.com
        level: CAN_MANAGE
