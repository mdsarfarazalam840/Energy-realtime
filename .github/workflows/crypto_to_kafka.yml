name: Crypto Market Data to Kafka

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes: near-realtime CoinGecko poll
  workflow_dispatch:
    inputs:
      coins:
        description: 'Top coins by market cap'
        required: false
        default: '100'
      trending:
        description: 'Trending coins'
        required: false
        default: '20'
      interval:
        description: 'Loop interval seconds (0 = run once)'
        required: false
        default: '0'

env:
  KAFKA_BOOTSTRAP: ${{ secrets.KAFKA_BOOTSTRAP }}
  KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
  KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
  KAFKA_CA_PEM: ${{ secrets.KAFKA_CA_PEM }}
  CRYPTO_TOPIC: 'crypto-market'
  CRYPTO_COINS: ${{ github.event.inputs.coins || '100' }}
  CRYPTO_TRENDING: ${{ github.event.inputs.trending || '20' }}
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests confluent-kafka

      - name: Write Kafka CA certificate
        run: |
          if [ -n "${{ secrets.KAFKA_CA_PEM }}" ]; then
            printf '%s\n' "${{ secrets.KAFKA_CA_PEM }}" > aiven_ca.pem
            echo "KAFKA_CA_LOCATION=aiven_ca.pem" >> $GITHUB_ENV
          fi

      - name: Run CoinGecko producer (single pass)
        run: |
          python producer_crypto.py --once --coins "${CRYPTO_COINS}" --trending "${CRYPTO_TRENDING}"

      - name: Trigger Databricks crypto ingest job
        if: success()
        run: |
          HOST="${DATABRICKS_HOST}"
          case "$HOST" in
            https://*) ;;
            http://*) HOST="https://${HOST#http://}" ;;
            *) HOST="https://${HOST}" ;;
          esac
          curl -sS --fail -X POST "${HOST}/api/2.1/jobs/run-now" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"job_id": "${{ vars.DATABRICKS_CRYPTO_JOB_ID }}"}'
          echo "Triggered Databricks crypto ingest job."
