name: Dual Energy Data to Kafka
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests confluent-kafka entsoe-py
      - name: Write CA Certificate to File
        run: |
          echo "${{ secrets.KAFKA_CA_PEM }}" > aiven_ca.pem
      - name: Run Dual Producer
        run: python producer_dual.py
      - name: Trigger Databricks Job
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"job_id": "913950436608512"}' \
            https://${{ secrets.DATABRICKS_HOST }}/api/2.1/jobs/run-now
        env:
          KAFKA_BOOTSTRAP: ${{ secrets.KAFKA_BOOTSTRAP }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          # KAFKA_CA_PEM: ${{ secrets.KAFKA_CA_PEM }}  # Can leave commented out temporarily