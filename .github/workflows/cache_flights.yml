name: Cache OpenSky Flights Snapshot

# Fail-Safe Cache for the Flights page: periodically fetch aircraft positions
# from OpenSky Network's anonymous states/all tier and commit a snapshot to
# docs/data/flights.json. The page is static and never calls the API itself —
# it reads this committed cache and falls back to a labelled demo deck, so the
# anonymous tier's rate limit is respected and a failed fetch never breaks it.
#
# No API key is used anywhere (the tier is anonymous but rate limited), so the
# hourly cadence stays polite and this can never leak a credential.

on:
  schedule:
    # Hourly, offset from the other cache jobs.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and write flights snapshot
        run: node scripts/cache_flights.mjs

      - name: Commit changed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage first: `git diff --quiet <path>` ignores an untracked file, so a
          # brand-new docs/data/flights.json would silently skip its first commit.
          git add docs/data/flights.json
          if git diff --cached --quiet; then
            echo "Flights snapshot unchanged; skipping commit."
          else
            git commit -m "chore(data): update OpenSky flights snapshot [skip ci]"
            git push
