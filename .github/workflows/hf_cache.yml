name: Cache Hugging Face Trending Models

# Fail-Safe Cache for the AI & Tech Trends widget: periodically fetch the
# latest trending models from the Hugging Face Hub API and commit a compact
# snapshot to docs/data/ai-trends.json. The static page falls back to this
# committed cache if the live API is unreachable, so the widget keeps showing
# real (not demo) trending models.

on:
  schedule:
    # Every 30 minutes, offset from the energy/crypto publish jobs.
    - cron: "29,59 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and write Hugging Face cache
        run: node scripts/cache_hf.mjs

      - name: Commit changed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/data/ai-trends.json; then
            echo "Hugging Face cache unchanged; skipping commit."
          else
            git add docs/data/ai-trends.json
            git commit -m "chore: update Hugging Face trending cache [skip ci]"
            git push
          fi
