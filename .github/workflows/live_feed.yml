name: Live Databricks Feed

# The five-minute lane. It refreshes only the fast-moving markets (AEMO
# five-minute dispatch and Elecz spot), asks Databricks to ingest them, waits
# for the run to finish, then publishes a tiny `docs/data/live.json`.
#
# The 30-minute "Energy Market Data to Kafka" workflow still owns the full feed
# (ENTSO-E day-ahead included) and the twice-hourly history snapshot. Keeping
# the two paths separate avoids spending ENTSO-E quota on a five-minute loop.
#
# GitHub's scheduler is best effort: a run can start a few minutes late. The
# optional Cloudflare Worker in `workers/live` can dispatch this workflow via
# its cron when precision matters.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-feed
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
      DATABRICKS_JOB_ID: ${{ vars.DATABRICKS_JOB_ID || '913950436608512' }}
      ENERGY_TABLE: ${{ vars.ENERGY_TABLE || 'workspace.default.energy_prices_realtime' }}
      TZ: UTC

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install producer and exporter dependencies
        run: pip install requests "confluent-kafka>=2.4"

      - name: Write Kafka CA certificate
        run: echo "${{ secrets.KAFKA_CA_PEM }}" > aiven_ca.pem

      - name: Produce the fast markets
        continue-on-error: true
        run: python producer_dual.py --live
        env:
          KAFKA_BOOTSTRAP: ${{ secrets.KAFKA_BOOTSTRAP }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
          AEMO_REGIONS: ${{ vars.AEMO_REGIONS }}
          ELECZ_ZONES: ${{ vars.ELECZ_ZONES }}

      - name: Trigger Databricks ingest and wait
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "$DATABRICKS_HOST" || { echo "::error::Missing DATABRICKS_HOST"; exit 1; }
          test -n "$DATABRICKS_TOKEN" || { echo "::error::Missing DATABRICKS_TOKEN"; exit 1; }
          host="${DATABRICKS_HOST#https://}"; host="${host#http://}"; host="${host%/}"

          run_id=$(curl -sf -X POST \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": ${DATABRICKS_JOB_ID}}" \
            "https://${host}/api/2.1/jobs/run-now" | jq -r '.run_id')
          test -n "$run_id" && test "$run_id" != "null" || { echo "::error::Could not start the Databricks job"; exit 1; }
          echo "Databricks run ${run_id} started"

          for i in $(seq 1 36); do
            state=$(curl -sf -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
              "https://${host}/api/2.1/jobs/runs/get?run_id=${run_id}")
            life=$(echo "$state" | jq -r '.state.life_cycle_state')
            result=$(echo "$state" | jq -r '.state.result_state // empty')
            echo "run ${run_id}: ${life}${result:+ / ${result}}"
            case "$life" in
              TERMINATED|SKIPPED|INTERNAL_ERROR)
                [ "$result" = "SUCCESS" ] || { echo "::warning::Databricks run finished with ${result:-$life}"; }
                break ;;
            esac
            sleep 10
          done

      - name: Export the live window
        if: always()
        run: python scripts/export_live_data.py --window-minutes 360 --max-rows 2000

      - name: Commit the live file when it changed
        id: commit
        run: |
          set -euo pipefail
          if [ ! -f docs/data/live.json ]; then
            echo "No live file produced."
            exit 0
          fi
          git add docs/data/live.json
          if git diff --cached --quiet; then
            echo "Live feed unchanged."
            exit 0
          fi
          rows=$(jq -r '.meta.row_count' docs/data/live.json)
          latest=$(jq -r '.meta.latest_timestamp' docs/data/live.json)
          git config user.name "voltscope-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(live): refresh realtime feed (${rows} points, ${latest}) [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "push attempt ${attempt} failed; retrying"
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## VoltScope live feed"
            echo ""
            if [ -f docs/data/live.json ]; then
              rows=$(jq -r '.meta.row_count' docs/data/live.json)
              latest=$(jq -r '.meta.latest_timestamp' docs/data/live.json)
              generated=$(jq -r '.generated_at' docs/data/live.json)
              query=$(jq -r '.meta.query_ms' docs/data/live.json)
              echo "- Points: **${rows}** (last $(jq -r '.window_minutes' docs/data/live.json) minutes)"
              echo "- Latest reading: \`${latest}\`"
              echo "- Published: \`${generated}\`"
              echo "- Query: ${query} ms"
            else
              echo "- No live file produced."
            fi
            echo ""
            echo "Live page: https://mdsaifedu.eu.cc/Energy-realtime/"
          } >> "$GITHUB_STEP_SUMMARY"
