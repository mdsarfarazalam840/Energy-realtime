<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">VoltScope repository map</title>
  <desc id="desc">A compact map of VoltScope code: scheduled producers and exporters, the Databricks bundle, public dashboard assets, an optional Cloudflare worker, and tests all support the published static site.</desc>
  <style>
    .bg{fill:#f7f4ee}.line{stroke:#d9d4ca;stroke-width:1}.edge{stroke:#62676f;stroke-width:1.2;fill:none;marker-end:url(#arrow)}.box{fill:#fffdf8;stroke:#d9d4ca;stroke-width:1}.accent{fill:#f4e4dc;stroke:#b4451f;stroke-width:1.4}.label{font:600 17px Inter,Segoe UI,sans-serif;fill:#22262e}.sub{font:12px Cascadia Code,Consolas,monospace;fill:#62676f}.cap{font:10px Cascadia Code,Consolas,monospace;letter-spacing:1.5px;fill:#9a9ea6}.note{font:11px Inter,Segoe UI,sans-serif;fill:#62676f}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62676f"/></marker></defs>
  <rect class="bg" width="1200" height="620"/><text x="52" y="58" class="cap">VOLTSCOPE / REPOSITORY MAP</text><text x="52" y="92" class="label" style="font-size:30px;font-family:Georgia,serif;font-weight:400">Code paths that turn market data into public pages</text><line class="line" x1="52" y1="122" x2="1148" y2="122"/>
  <path class="edge" d="M250 243H332"/><path class="edge" d="M518 243H600"/><path class="edge" d="M786 243H868"/><path class="edge" d="M974 290V370"/><path class="edge" d="M694 290V370"/><path class="edge" d="M424 290V370"/>
  <g><rect class="box" x="52" y="190" width="198" height="100" rx="6"/><text x="70" y="215" class="cap">SCHEDULED INPUTS</text><text x="70" y="243" class="label">Producers</text><text x="70" y="267" class="sub">producer_dual.py</text><text x="70" y="282" class="sub">producer_crypto.py</text></g>
  <g><rect class="box" x="332" y="190" width="186" height="100" rx="6"/><text x="350" y="215" class="cap">AUTOMATION</text><text x="350" y="243" class="label">GitHub Actions</text><text x="350" y="267" class="sub">.github/workflows/</text><text x="350" y="282" class="sub">ingest + publish</text></g>
  <g><rect class="box" x="600" y="190" width="186" height="100" rx="6"/><text x="618" y="215" class="cap">LAKEHOUSE</text><text x="618" y="243" class="label">Databricks bundle</text><text x="618" y="267" class="sub">resources/ + src/</text><text x="618" y="282" class="sub">Kafka → Delta</text></g>
  <g><rect class="accent" x="868" y="190" width="280" height="100" rx="6"/><text x="886" y="215" class="cap" style="fill:#b4451f">PUBLIC ARTIFACT</text><text x="886" y="243" class="label">docs/ static site</text><text x="886" y="267" class="sub">JSON snapshots + Three.js pages</text><text x="886" y="282" class="sub">GitHub Pages</text></g>
  <g><rect class="box" x="272" y="370" width="304" height="112" rx="6"/><text x="290" y="396" class="cap">PUBLICATION CODE</text><text x="290" y="425" class="label">scripts/</text><text x="290" y="449" class="sub">energy shards · live tail · crypto</text><text x="290" y="464" class="sub">EDGAR export · HN cache</text></g>
  <g><rect class="box" x="602" y="370" width="230" height="112" rx="6"/><text x="620" y="396" class="cap">OPTIONAL REALTIME</text><text x="620" y="425" class="label">workers/live/</text><text x="620" y="449" class="sub">Cloudflare presence relay</text><text x="620" y="464" class="sub">WebSocket rooms</text></g>
  <g><rect class="box" x="858" y="370" width="290" height="112" rx="6"/><text x="876" y="396" class="cap">QUALITY GATES</text><text x="876" y="425" class="label">tests/ + fixtures/</text><text x="876" y="449" class="sub">contracts · load · browser audits</text><text x="876" y="464" class="sub">offline sample data</text></g>
  <line class="line" x1="52" y1="532" x2="1148" y2="532"/><text x="52" y="560" class="note">Primary publication path: Actions orchestrates collection and export; the browser consumes only committed files under docs/data/.</text><text x="52" y="582" class="note">Editorial styling: 4px-aligned geometry, hairline rules, one accent family, and a single left-to-right primary path.</text>
</svg>
